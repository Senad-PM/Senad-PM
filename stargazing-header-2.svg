      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#ffb86b" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#61DAFB" stop-opacity="0.75"/>
      <stop offset="85%" stop-color="#7b5fe0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7b5fe0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="holeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#61DAFB" stop-opacity="0"/>
    </radialGradient>
  </defs>

