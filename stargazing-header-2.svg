<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="45%" stop-color="#150f2e"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </linearGradient>

    <radialGradient id="galaxyGlow" cx="18%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7b5fe0" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#4a3f9e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4a3f9e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planetBody" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c5cd6"/>
      <stop offset="100%" stop-color="#3d2c85"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a5f3ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#61DAFB" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#61DAFB"/>
    </linearGradient>

    <!-- black hole: dark core + swirling accretion disk -->
    <radialGradient id="holeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="75%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a12"/>
